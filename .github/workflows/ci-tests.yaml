on: [push, pull_request]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis (PHP 8.3)

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse

      - name: PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        scenario: ['behat3', 'behat4']
        include:
          - php: '8.6'
            scenario: 'behat3'
            experimental: true
          - php: '8.6'
            scenario: 'behat4'
            experimental: true

    name: PHP ${{ matrix.php }} / ${{ matrix.scenario }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          cp ".scenarios.lock/${{ matrix.scenario }}/composer.lock" composer.lock
          composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer tests:unit

      - name: Start PHP built-in server
        run: php -S localhost:8531 -t app &

      - name: Run Behat
        run: composer tests:behat
