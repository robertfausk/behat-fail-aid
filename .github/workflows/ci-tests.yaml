on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        behat: ['^3.5', '^4.0']
        include:
          - php: '8.6'
            behat: '^4.0'
            experimental: true
          - php: '8.6'
            behat: '^3.5'
            experimental: true

    name: PHP ${{ matrix.php }} / Behat ${{ matrix.behat }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer require --no-interaction --prefer-dist --no-update "behat/behat:${{ matrix.behat }}" && composer update --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: composer tests:unit

      - name: Start PHP built-in server
        run: php -S localhost:8531 -t app &

      - name: Run Behat
        run: composer tests:behat
